<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}drop{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/schibsted-grotesk.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('main.index') }}">drop</a>
    {% if session.get('logged_in') %}
      {% set here = request.endpoint %}
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a href="{{ url_for('main.index') }}"{% if here == 'main.index' %} aria-current="page"{% endif %}>Links</a>
        <a href="{{ url_for('drops.new') }}"{% if here == 'drops.new' %} aria-current="page"{% endif %}>Neuer Drop</a>
        <a href="{{ url_for('stats.dashboard') }}"{% if here == 'stats.dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
        <a class="logout" href="{{ url_for('auth.logout') }}">Logout</a>
      </nav>
    {% endif %}
  </header>
  <main class="site-main">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash flash-{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
